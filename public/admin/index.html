<!doctype html>
<html lang="hr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Uređivanje · Midnight Crew</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <script src="https://unpkg.com/@sveltia/cms@0.224.0/dist/sveltia-cms.js"></script>
    <!-- Orders live in the same place as the rest of the content: a button opens /narudzbe on top of the CMS. -->
    <button id="mc-orders" type="button" style="position:fixed;right:16px;bottom:16px;z-index:50;padding:10px 18px;border:0;border-radius:999px;background:#e8ff3a;color:#111;font:700 15px system-ui,sans-serif;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.35)">Narudžbe</button>
    <div id="mc-orders-panel" hidden style="position:fixed;inset:0;z-index:60;background:#0e0b14">
      <button id="mc-orders-close" type="button" style="position:absolute;right:16px;top:12px;z-index:2;padding:8px 16px;border:0;border-radius:999px;background:#fff;color:#111;font:700 15px system-ui,sans-serif;cursor:pointer">Zatvori</button>
      <iframe id="mc-orders-frame" title="Narudžbe" style="width:100%;height:100%;border:0"></iframe>
    </div>
    <script>
      var panel = document.getElementById('mc-orders-panel'), frame = document.getElementById('mc-orders-frame')
      document.getElementById('mc-orders').onclick = function () {
        if (!frame.src) frame.src = '/narudzbe'
        panel.hidden = false
      }
      document.getElementById('mc-orders-close').onclick = function () { panel.hidden = true }
    </script>
  </body>
</html>
