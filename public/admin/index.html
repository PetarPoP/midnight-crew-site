<!doctype html>
<html lang="hr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Uređivanje · Midnight Crew</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <script src="https://unpkg.com/@sveltia/cms@0.224.0/dist/sveltia-cms.js"></script>
    <!-- Orders and garage requests, on top of the CMS. Data comes from /api/orders with the ADMIN_KEY secret. -->
    <style>
      #mc-btn{position:fixed;right:16px;bottom:16px;z-index:50;padding:10px 18px;border:0;border-radius:999px;background:#e8ff3a;color:#111;font:700 15px system-ui,sans-serif;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.35)}
      #mc-panel{position:fixed;inset:0;z-index:60;overflow:auto;background:#0e0b14;color:#eee;font:15px/1.4 system-ui,sans-serif;padding:24px}
      #mc-panel[hidden]{display:none}
      #mc-panel h1{margin:0 0 16px;font-size:28px} #mc-panel h2{margin:28px 0 12px;font-size:20px}
      #mc-panel .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
      #mc-panel button,#mc-panel select,#mc-panel input{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid #444;background:#1c1726;color:#eee}
      #mc-panel button{cursor:pointer} #mc-panel .close{margin-left:auto;background:#fff;color:#111;border:0}
      #mc-panel .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
      #mc-panel .card{background:#1c1726;border-radius:10px;padding:14px}
      #mc-panel .muted{color:#999;font-size:13px} #mc-panel a{color:#e8ff3a} #mc-panel .err{color:#ff6b6b}
      #mc-panel .st-nova{border-left:4px solid #e8ff3a} #mc-panel .st-otkazana{opacity:.55}
    </style>
    <button id="mc-btn" type="button">Narudžbe</button>
    <div id="mc-panel" hidden>
      <div class="bar"><h1>Narudžbe</h1><button id="mc-reload" type="button">Osvježi</button><button id="mc-logout" type="button">Odjava</button><button class="close" id="mc-close" type="button">Zatvori</button></div>
      <form id="mc-login" class="bar" hidden><input id="mc-key" type="password" placeholder="ADMIN_KEY" autocomplete="current-password" /><button>Uđi</button></form>
      <p id="mc-msg" class="err"></p>
      <div id="mc-out"></div>
    </div>
    <script>
      ;(function () {
        var $ = function (id) { return document.getElementById(id) }
        var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';' }) }
        var key = function () { try { return sessionStorage.getItem('mc-admin') || '' } catch (e) { return '' } }
        var setKey = function (k) { try { k ? sessionStorage.setItem('mc-admin', k) : sessionStorage.removeItem('mc-admin') } catch (e) {} }

        function load() {
          $('mc-msg').textContent = ''
          if (!key()) { $('mc-login').hidden = false; $('mc-out').innerHTML = ''; return }
          $('mc-login').hidden = true
          fetch('/api/orders', { headers: { 'x-admin-key': key() } })
            .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j } }) })
            .then(function (res) {
              if (!res.ok) { setKey(''); $('mc-login').hidden = false; $('mc-msg').textContent = res.j.error || 'Greška.'; return }
              render(res.j)
            })
            .catch(function () { $('mc-msg').textContent = 'Greška pri učitavanju.' })
        }

        function render(d) {
          var o = d.orders.map(function (x) {
            var items = x.items.map(function (i) { return esc(i.qty + '× ' + i.name + (i.size ? ' (' + i.size + ')' : '') + ' · ' + i.qty * i.price + ' KM') }).join('<br>')
            var opts = d.statuses.map(function (s) { return '<option' + (s === x.status ? ' selected' : '') + '>' + esc(s) + '</option>' }).join('')
            return '<div class="card st-' + esc(x.status) + '"><div class="bar"><b>#' + x.id + '</b><span class="muted">' + esc(x.created_at) + ' UTC</span></div>' +
              '<div><b>' + esc(x.first_name + ' ' + x.last_name) + '</b></div><a href="tel:' + esc(x.phone) + '">' + esc(x.phone) + '</a>' +
              '<div>' + esc(x.street + ', ' + x.postal + ' ' + x.city) + '</div><p>' + items + '</p>' +
              (x.note ? '<p class="muted">„' + esc(x.note) + '“</p>' : '') +
              '<div class="bar"><b>' + x.total + ' KM</b><select data-id="' + x.id + '" style="margin-left:auto">' + opts + '</select></div></div>'
          }).join('')
          var r = d.requests.map(function (x) {
            return '<div class="card"><div class="bar"><b>' + esc(x.car) + '</b><span class="muted">' + esc(x.created_at) + ' UTC</span></div><div>' + esc(x.name) +
              (x.instagram ? ' · <a target="_blank" rel="noopener" href="https://www.instagram.com/' + esc(x.instagram) + '/">@' + esc(x.instagram) + '</a>' : '') + '</div>' +
              (x.message ? '<p class="muted">' + esc(x.message) + '</p>' : '') + '</div>'
          }).join('')
          $('mc-out').innerHTML = (o ? '<div class="grid">' + o + '</div>' : '<p class="muted">Još nema narudžbi.</p>') +
            '<h2>Garaža: Javi se</h2>' + (r ? '<div class="grid">' + r + '</div>' : '<p class="muted">Još nema poruka.</p>')
        }

        $('mc-out').addEventListener('change', function (e) {
          var sel = e.target
          if (!sel.dataset || !sel.dataset.id) return
          fetch('/api/orders', { method: 'POST', headers: { 'content-type': 'application/json', 'x-admin-key': key() }, body: JSON.stringify({ id: +sel.dataset.id, status: sel.value }) })
            .then(function (r) { if (!r.ok) throw 0; sel.closest('.card').className = 'card st-' + sel.value })
            .catch(function () { $('mc-msg').textContent = 'Status nije spremljen.' })
        })
        $('mc-login').addEventListener('submit', function (e) { e.preventDefault(); setKey($('mc-key').value.trim()); $('mc-key').value = ''; load() })
        $('mc-btn').onclick = function () { $('mc-panel').hidden = false; load() }
        $('mc-close').onclick = function () { $('mc-panel').hidden = true }
        $('mc-reload').onclick = load
        $('mc-logout').onclick = function () { setKey(''); load() }
      })()
    </script>
  </body>
</html>
